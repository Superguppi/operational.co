<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passwort zurücksetzen</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1117;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      background: #1a1c23;
      border-radius: 12px;
      padding: 2.5rem;
      width: 100%;
      max-width: 400px;
      border: 1px solid #2a2d36;
    }
    h1 { font-size: 1.4rem; margin-bottom: 0.5rem; }
    p { color: #8b8fa3; font-size: 0.9rem; margin-bottom: 1.5rem; }
    label { display: block; font-size: 0.85rem; color: #8b8fa3; margin-bottom: 0.35rem; }
    input {
      width: 100%;
      padding: 0.7rem 0.85rem;
      background: #12141a;
      border: 1px solid #2a2d36;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      margin-bottom: 1rem;
      outline: none;
    }
    input:focus { border-color: #6c63ff; }
    button {
      width: 100%;
      padding: 0.75rem;
      background: #6c63ff;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #5a52d5; }
    button:disabled { background: #3a3760; cursor: not-allowed; }
    .msg { margin-top: 1rem; font-size: 0.85rem; text-align: center; display: none; }
    .msg.ok { color: #4caf50; display: block; }
    .msg.err { color: #ef5350; display: block; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Passwort zurücksetzen</h1>
    <p>Gib dein neues Passwort ein.</p>
    <label>Neues Passwort</label>
    <input type="password" id="pw1" placeholder="Mindestens 8 Zeichen">
    <label>Passwort wiederholen</label>
    <input type="password" id="pw2" placeholder="Noch einmal eingeben">
    <button id="btn">Passwort setzen</button>
    <div class="msg" id="msg"></div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    if (!token) {
      document.getElementById("msg").className = "msg err";
      document.getElementById("msg").textContent = "Kein gültiger Token. Bitte neuen Reset-Link anfordern.";
      document.getElementById("btn").disabled = true;
    }

    document.getElementById("btn").addEventListener("click", async () => {
      const pw1 = document.getElementById("pw1").value;
      const pw2 = document.getElementById("pw2").value;
      const msg = document.getElementById("msg");
      const btn = document.getElementById("btn");

      msg.className = "msg";
      msg.textContent = "";

      if (!pw1 || pw1.length < 8) {
        msg.className = "msg err"; msg.textContent = "Passwort muss mindestens 8 Zeichen lang sein."; return;
      }
      if (pw1 !== pw2) {
        msg.className = "msg err"; msg.textContent = "Passwörter stimmen nicht überein."; return;
      }

      btn.disabled = true;
      btn.textContent = "Wird gesetzt...";

      try {
        const apiBase = window.__APP_CONFIG__?.VITE_API_URL || "/api";
        const res = await fetch(apiBase + "/user/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, password: pw1 })
        });

        if (res.ok) {
          const data = await res.json();
          msg.className = "msg ok";
          if (data.inviteAccepted) {
            msg.textContent = "Passwort gesetzt und Einladung akzeptiert! Du kannst dich jetzt anmelden.";
          } else {
            msg.textContent = "Passwort erfolgreich gesetzt! Du kannst dich jetzt anmelden.";
          }
          btn.textContent = "Zur Anmeldung";
          btn.disabled = false;
          btn.onclick = () => { window.location.href = "/"; };
        } else {
          const data = await res.json();
          msg.className = "msg err";
          msg.textContent = data.message || "Fehler beim Setzen des Passworts.";
          btn.disabled = false;
          btn.textContent = "Passwort setzen";
        }
      } catch (err) {
        msg.className = "msg err";
        msg.textContent = "Netzwerkfehler. Bitte noch einmal versuchen.";
        btn.disabled = false;
        btn.textContent = "Passwort setzen";
      }
    });
  </script>
</body>
</html>
